  .badge { font-size: 11.5px; font-weight: 700; padding: 3px 11px; border-radius: 999px; border: 1px solid #dbdac9; }
  table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 12.5px; }
  th, td { border: 1px solid #dbdac9; padding: 7px 10px; text-align: right; vertical-align: top; }
  th { background: #f1f0ec; font-weight: 700; white-space: nowrap; width: 160px; }
  .grid th { width: auto; background: #1a1a18; color: #fff; }
  .grid td { font-size: 12px; white-space: pre-line; }
  .sec-label { font-size: 12px; font-weight: 700; color: #706e65; text-transform: none; margin: 18px 0 7px; }
  .desc { font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  ul.chk { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
  ul.chk li { padding: 5px 0; border-bottom: 1px solid #ece8e6; }
  ul.chk li .mk { font-weight: 700; margin-inline-end: 8px; }
  ul.chk li.done { color: #216e4e; }
  .muted { color: #9b988d; }
  .metrics { display: flex; gap: 10px; margin-bottom: 18px; }
  .metric { flex: 1; border: 1px solid #dbdac9; padding: 10px 12px; }
  .metric .l { font-size: 11px; color: #706e65; }
  .metric .v { font-size: 22px; font-weight: 800; }
  .doc-foot { margin-top: 22px; padding-top: 10px; border-top: 1px solid #dbdac9; font-size: 11px; color: #9b988d; display: flex; justify-content: space-between; }
